<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Suman's Cloud ☁️</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg: #0f172a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; }
        .hidden { display: none !important; }
        
        /* LOGIN */
        #loginPage { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .loginBox { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 340px; backdrop-filter: blur(10px); }
        
        /* APP UI */
        #appPage { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .storage-card { background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1)); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
        
        .upload-section { border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 20px; transition: 0.3s; }
        .upload-section:hover { border-color: var(--primary); background: rgba(102,126,234,0.05); }

        .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; border-radius: 10px; cursor: pointer; text-align: center; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .file-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .file-info { display: flex; flex-direction: column; }
        .file-name { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; }
        .file-meta { font-size: 11px; color: #94a3b8; }
        
        .action-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        
        /* TOAST */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; z-index: 100; animation: slideUp 0.3s; }
        @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="loginBox">
        <h2 style="margin-bottom: 10px;">☁️ Suman's Cloud</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">আপনার সিকিউর স্টোরেজ</p>
        <input type="password" id="pwInput" class="btn" style="background: rgba(255,255,255,0.1); width: 100%; text-align: center; margin-bottom: 10px;" placeholder="Password লিখুন">
        <button class="btn" style="width: 100%;" onclick="login()">প্রবেশ করুন</button>
    </div>
</div>

<div id="appPage" class="hidden">
    <div class="header">
        <h2 style="font-size: 18px;">Suman's Cloud</h2>
        <button class="action-btn" style="color: #ccc; border-color: #444;" onclick="location.reload()">🔄 Refresh</button>
    </div>

    <div class="storage-card">
        <div style="font-size: 24px; font-weight: 700;" id="usedSize">0 B</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;" id="stats">০ টি ফাইল আপলোড করা হয়েছে</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabFiles" onclick="switchTab('files')">📁 Files</div>
        <div class="tab" id="tabRecycle" onclick="switchTab('recycle')">🗑️ Recycle</div>
    </div>

    <div id="filesContent">
        <div class="upload-section">
            <input type="file" id="fileInput" multiple hidden onchange="handleUpload(this)">
            <button class="btn" onclick="document.getElementById('fileInput').click()">📤 নতুন ফাইল আপলোড</button>
            <div id="progBar" class="hidden" style="margin-top: 15px;">
                <div style="height: 4px; background: #334155; border-radius: 10px; overflow: hidden;">
                    <div id="progFill" style="height: 100%; width: 0%; background: var(--primary); transition: 0.3s;"></div>
                </div>
                <p id="progTxt" style="font-size: 10px; margin-top: 5px;">0% আপলোড হচ্ছে...</p>
            </div>
        </div>
        <div class="file-list" id="mainList"></div>
    </div>

    <div id="recycleContent" class="hidden">
        <div class="file-list" id="recycleList"></div>
    </div>
</div>

<script>
    const BOT_TOKEN = "8703347824:AAHT2yKhqV5fp2j70H3bl9gQORqd1p1wOJ4";
    const CHAT_ID = "-1003981955339";
    const TAG = "SC_DATA_V3:";
    let files = [], recycle = [], currentMsgId = null;

    function login() {
        const pass = document.getElementById("pwInput").value;
        if(pass === "Suman400@") {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("appPage").classList.remove("hidden");
            syncData();
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    async function syncData() {
        showToast("ডাটা সিঙ্ক হচ্ছে...", "info");
        try {
            const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-10`);
            const d = await r.json();
            if(d.ok && d.result.length > 0) {
                const updates = d.result.reverse();
                for(let u of updates) {
                    const msg = u.channel_post || u.message;
                    if(msg && msg.text && msg.text.startsWith(TAG)) {
                        const data = JSON.parse(msg.text.replace(TAG, ""));
                        files = data.files || [];
                        recycle = data.recycle || [];
                        currentMsgId = msg.message_id;
                        break;
                    }
                }
            }
            render();
        } catch(e) {
            showToast("সার্ভার থেকে ডাটা পাওয়া যায়নি", "err");
        }
    }

    async function saveData() {
        const text = TAG + JSON.stringify({ files, recycle });
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        });
        const res = await r.json();
        if(res.ok) {
            if(currentMsgId) {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage?chat_id=${CHAT_ID}&message_id=${currentMsgId}`);
            }
            currentMsgId = res.result.message_id;
        }
    }

    async function handleUpload(input) {
        const upFiles = Array.from(input.files);
        if(!upFiles.length) return;
        
        document.getElementById("progBar").classList.remove("hidden");
        const fill = document.getElementById("progFill");
        const txt = document.getElementById("progTxt");

        for(let i=0; i<upFiles.length; i++) {
            const f = upFiles[i];
            const fd = new FormData();
            fd.append("chat_id", CHAT_ID);
            fd.append("document", f);

            try {
                const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: 'POST', body: fd });
                const d = await r.json();
                if(d.ok) {
                    files.unshift({
                        id: Date.now(),
                        name: f.name,
                        size: f.size,
                        fileId: d.result.document.file_id,
                        date: new Date().toLocaleDateString('bn-IN')
                    });
                }
            } catch(e) {}
            
            let p = Math.round(((i+1)/upFiles.length)*100);
            fill.style.width = p + "%";
            txt.innerText = p + "% আপলোড হয়েছে...";
        }
        
        await saveData();
        document.getElementById("progBar").classList.add("hidden");
        input.value = "";
        render();
        showToast("সব ফাইল আপলোড হয়েছে!", "ok");
    }

    function render() {
        const list = document.getElementById("mainList");
        const recList = document.getElementById("recycleList");
        
        let totalSize = files.reduce((a, b) => a + b.size, 0);
        document.getElementById("usedSize").innerText = formatBytes(totalSize);
        document.getElementById("stats").innerText = files.length + " টি ফাইল স্টোরেজে আছে";

        list.innerHTML = files.map(f => `
            <div class="file-card">
                <div class="file-info">
                    <span class="file-name">${f.name}</span>
                    <span class="file-meta">${formatBytes(f.size)} • ${f.date}</span>
                </div>
                <button class="action-btn" onclick="moveToRecycle(${f.id})">🗑️</button>
            </div>
        `).join('') || '<p style="text-align:center; color:#444; padding:20px;">কোনো ফাইল নেই</p>';

        recList.innerHTML = recycle.map(f => `
            <div class="file-card">
                <div class="file-info">
                    <span class="file-name">${f.name}</span>
                </div>
                <button class="action-btn" style="color:#51cf66; border-color:#51cf66;" onclick="restore(${f.id})">🔄</button>
            </div>
        `).join('') || '<p style="text-align:center; color:#444; padding:20px;">বিন খালি</p>';
    }

    async function moveToRecycle(id) {
        const idx = files.findIndex(f => f.id === id);
        recycle.unshift(files.splice(idx, 1)[0]);
        await saveData();
        render();
    }

    async function restore(id) {
        const idx = recycle.findIndex(f => f.id === id);
        files.unshift(recycle.splice(idx, 1)[0]);
        await saveData();
        render();
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function switchTab(t) {
        document.getElementById("filesContent").classList.toggle("hidden", t !== 'files');
        document.getElementById("recycleContent").classList.toggle("hidden", t !== 'recycle');
        document.getElementById("tabFiles").classList.toggle("active", t === 'files');
        document.getElementById("tabRecycle").classList.toggle("active", t === 'recycle');
    }

    function showToast(m, type) {
        const t = document.createElement("div");
        t.className = "toast";
        t.style.background = type === 'err' ? '#ef4444' : '#10b981';
        t.style.color = "white";
        t.innerText = m;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
</script>
</body>
</html>
