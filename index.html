<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suman's Cloud ☁️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff}
.hidden{display:none!important}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.loginBox{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:40px 36px;width:320px;text-align:center}
.ico{font-size:52px;margin-bottom:8px}
.loginBox h2{font-size:21px;font-weight:700;margin-bottom:4px}
.loginBox p{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:24px}
.ipt{width:100%;padding:11px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;font-size:15px;outline:none;margin-bottom:8px}
.ipt.err{border-color:#ff6b6b}
.errMsg{color:#ff6b6b;font-size:13px;margin-bottom:8px;display:none}
.btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.linkBtn{background:none;border:none;color:#a5b4fc;font-size:13px;cursor:pointer;margin-top:12px;text-decoration:underline}
#appPage{max-width:780px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.header h1{font-size:20px;font-weight:800}
.header p{color:rgba(255,255,255,0.4);font-size:11px;margin-top:2px}
.hdrBtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:12px}
.storageBox{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.storageTxt{font-size:13px;color:rgba(255,255,255,0.6)}
.storageTxt b{color:#fff;font-size:15px}
.tgBadge{background:rgba(32,168,234,0.15);border:1px solid rgba(32,168,234,0.3);color:#29b6f6;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700}
.uploadArea{border:2px dashed rgba(255,255,255,0.2);border-radius:18px;padding:20px 16px;text-align:center;background:rgba(255,255,255,0.04);margin-bottom:14px}
.upBtns{display:flex;gap:8px;justify-content:center;margin-top:10px}
.upBtn{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;font-size:13px}
.progressWrap{margin-top:12px;display:none}
.progressBar{height:6px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden}
.progressFill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width .3s}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);cursor:pointer}
.tab.active{background:rgba(102,126,234,0.3);border-color:#667eea;color:#fff}
.fileCard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fileInfo{flex:1;min-width:0}
.fileName{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileMeta{color:rgba(255,255,255,0.35);font-size:11px}
.iconBtn{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid;background:transparent;color:#fff}
.toast{position:fixed;top:20px;right:20px;padding:11px 18px;border-radius:12px;z-index:9999;animation:fadeIn .3s}
.toast.ok{background:#51cf66}.toast.err{background:#ff6b6b}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="loginPage">
    <div class="loginBox">
        <div class="ico">☁️</div>
        <h2>Suman's Cloud</h2>
        <p>Password দিয়ে প্রবেশ করুন</p>
        <input type="password" class="ipt" id="pwInput" placeholder="Password..."/>
        <div class="errMsg" id="errMsg">❌ ভুল Password!</div>
        <button class="btn" id="loginBtn">প্রবেশ করুন</button>
    </div>
</div>

<div id="appPage" class="hidden">
    <div class="header">
        <h1>☁️ Suman's Cloud</h1>
        <button class="hdrBtn" id="logoutBtn">🔒 Logout</button>
    </div>

    <div class="storageBox">
        <div class="storageTxt">মোট ফাইল: <b id="stats">0</b> | সাইজ: <b id="usedSize">0 B</b></div>
        <div class="tgBadge">Unlimited</div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabFiles">📁 Files</button>
        <button class="tab" id="tabRecycle">🗑️ Recycle</button>
    </div>

    <div id="filesTab">
        <div class="uploadArea">
            <input type="file" id="fileInput" multiple hidden/>
            <button class="upBtn" onclick="document.getElementById('fileInput').click()">📤 ফাইল আপলোড করুন</button>
            <div class="progressWrap" id="progressWrap">
                <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
                <div id="progressTxt" style="font-size:10px; margin-top:5px">0%</div>
            </div>
        </div>
        <div id="mainList"></div>
    </div>

    <div id="recycleTab" class="hidden">
        <div id="recycleList"></div>
    </div>
</div>

<script>
const TG_TOKEN = "8703347824:AAHT2yKhqV5fp2j70H3bl9gQORqd1p1wOJ4";
const TG_CHAT  = "-1003981955339";
const TG       = `https://api.telegram.org/bot${TG_TOKEN}`;
const DATA_TAG = "SC_DATA_V3:";

let PASS = localStorage.getItem("suman_pw") || "Suman400@";
let files = [];
let recycle = [];
let dataMsgId = null;

// --- LOGIN ---
document.getElementById("loginBtn").onclick = () => {
    if (document.getElementById("pwInput").value === PASS) {
        showApp();
    } else {
        document.getElementById("errMsg").style.display = "block";
    }
};

function showApp() {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("appPage").classList.remove("hidden");
    loadData();
}

// --- CORE FUNCTIONS ---
async function tg(method, body) {
    const r = await fetch(`${TG}/${method}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });
    return r.json();
}

async function loadData() {
    try {
        // চ্যানেলের লেটেস্ট ১০০ মেসেজ থেকে ডাটা খোঁজা
        const r = await fetch(`${TG}/getUpdates?limit=100&offset=-100`);
        const d = await r.json();
        if (d.ok && d.result.length > 0) {
            const updates = d.result.reverse();
            for (const u of updates) {
                const msg = u.channel_post || u.message;
                const txt = msg?.text || "";
                if (txt.startsWith(DATA_TAG)) {
                    const rec = JSON.parse(txt.slice(DATA_TAG.length));
                    files = rec.files || [];
                    recycle = rec.recycle || [];
                    dataMsgId = String(msg.message_id);
                    break;
                }
            }
        }
        render();
    } catch (e) { toast("লোড হতে সমস্যা হয়েছে", "err"); }
}

async function saveData() {
    const txt = DATA_TAG + JSON.stringify({ files, recycle });
    const r = await tg("sendMessage", { chat_id: TG_CHAT, text: txt });
    if (r.ok) {
        if (dataMsgId) tg("deleteMessage", { chat_id: TG_CHAT, message_id: parseInt(dataMsgId) });
        dataMsgId = String(r.result.message_id);
    }
}

// --- UPLOAD ---
document.getElementById("fileInput").onchange = async (e) => {
    const col = Array.from(e.target.files);
    const pw = document.getElementById("progressWrap");
    const pf = document.getElementById("progressFill");
    pw.style.display = "block";

    for (let i = 0; i < col.length; i++) {
        const file = col[i];
        const fd = new FormData();
        fd.append("chat_id", TG_CHAT);
        fd.append("document", file);
        
        const r = await fetch(`${TG}/sendDocument`, { method: "POST", body: fd });
        const d = await r.json();
        
        if (d.ok) {
            files.unshift({
                id: Date.now(),
                name: file.name,
                size: file.size,
                fileId: d.result.document.file_id,
                date: new Date().toLocaleDateString("bn-IN")
            });
        }
        pf.style.width = ((i + 1) / col.length * 100) + "%";
    }
    await saveData();
    pw.style.display = "none";
    render();
    toast("আপলোড সফল হয়েছে ✅");
};

// --- RENDER ---
function fmtSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
}

function render() {
    const list = document.getElementById("mainList");
    document.getElementById("stats").textContent = files.length;
    document.getElementById("usedSize").textContent = fmtSize(files.reduce((a, f) => a + f.size, 0));
    
    list.innerHTML = files.map(f => `
        <div class="fileCard">
            <div class="fileInfo">
                <div class="fileName">${f.name}</div>
                <div class="fileMeta">${fmtSize(f.size)} | ${f.date}</div>
            </div>
            <button class="iconBtn" style="border-color:#ff6b6b" onclick="delFile(${f.id})">🗑️</button>
        </div>
    `).join("");
}

async function delFile(id) {
    const idx = files.findIndex(f => f.id === id);
    if (idx > -1) {
        recycle.unshift(files.splice(idx, 1)[0]);
        await saveData();
        render();
        toast("রিসাইকেল বিনে সরানো হয়েছে");
    }
}

function toast(m, t = "ok") {
    const div = document.createElement("div");
    div.className = `toast ${t}`;
    div.textContent = m;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2500);
}

// --- TABS ---
document.getElementById("tabFiles").onclick = () => {
    document.getElementById("filesTab").classList.remove("hidden");
    document.getElementById("recycleTab").classList.add("hidden");
};
document.getElementById("tabRecycle").onclick = () => {
    document.getElementById("filesTab").classList.add("hidden");
    document.getElementById("recycleTab").classList.remove("hidden");
    renderRecycle();
};

function renderRecycle() {
    const rList = document.getElementById("recycleList");
    rList.innerHTML = recycle.map(f => `
        <div class="fileCard">
            <div class="fileInfo"><div class="fileName">${f.name}</div></div>
            <button class="iconBtn" onclick="restore(${f.id})">🔄</button>
        </div>
    `).join("");
}

async function restore(id) {
    const idx = recycle.findIndex(f => f.id === id);
    files.unshift(recycle.splice(idx, 1)[0]);
    await saveData();
    renderRecycle();
    toast("রিস্টোর হয়েছে");
}
</script>

</body>
</html>
