<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suman's Cloud ☁️</title>
<style>
/* আপনার আগের সেই ডিজাইন যা আপনি পছন্দ করেছিলেন */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff}
.hidden{display:none!important}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.loginBox{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:40px 36px;width:320px;text-align:center}
.ico{font-size:52px;margin-bottom:8px}
.loginBox h2{font-size:21px;font-weight:700;margin-bottom:4px}
.ipt{width:100%;padding:11px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;outline:none;margin-bottom:8px}
.btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:700;cursor:pointer}
#appPage{max-width:780px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.storageBox{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.uploadArea{border:2px dashed rgba(255,255,255,0.2);border-radius:18px;padding:20px;text-align:center;background:rgba(255,255,255,0.04);margin-bottom:14px}
.fileCard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fileInfo{flex:1;min-width:0}
.fileName{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progressWrap{margin-top:12px;display:none}
.progressBar{height:6px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden}
.progressFill{height:100%;background:#667eea;width:0%}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);cursor:pointer}
.tab.active{background:rgba(102,126,234,0.3);color:#fff;border-color:#667eea}
</style>
</head>
<body>

<div id="loginPage">
    <div class="loginBox">
        <div class="ico">☁️</div>
        <h2>Suman's Cloud</h2>
        <input type="password" class="ipt" id="pwInput" placeholder="Password..."/>
        <button class="btn" onclick="login()">প্রবেশ করুন</button>
    </div>
</div>

<div id="appPage" class="hidden">
    <div class="header">
        <h1>☁️ Suman's Cloud</h1>
        <button onclick="location.reload()" style="background:none; border:none; color:#a5b4fc; cursor:pointer;">🔄 Sync</button>
    </div>

    <div class="storageBox">
        <div>মোট ফাইল: <b id="stats">0</b> | সাইজ: <b id="usedSize">0 B</b></div>
        <div style="color:#29b6f6; font-weight:700">Unlimited</div>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabFiles" onclick="switchTab('files')">📁 Files</button>
        <button class="tab" id="tabRecycle" onclick="switchTab('recycle')">🗑️ Recycle</button>
    </div>

    <div id="filesView">
        <div class="uploadArea">
            <input type="file" id="fileInput" multiple hidden onchange="uploadFiles(this)"/>
            <button onclick="document.getElementById('fileInput').click()" style="background:rgba(255,255,255,0.1); border:1px solid #555; color:#fff; padding:8px 15px; border-radius:10px; cursor:pointer;">📤 ফাইল আপলোড করুন</button>
            <div class="progressWrap" id="pw">
                <div class="progressBar"><div class="progressFill" id="pf"></div></div>
            </div>
        </div>
        <div id="mainList"></div>
    </div>

    <div id="recycleView" class="hidden">
        <div id="recycleList"></div>
    </div>
</div>

<script>
const BOT_TOKEN = "8703347824:AAHT2yKhqV5fp2j70H3bl9gQORqd1p1wOJ4";
const CHAT_ID = "-1003981955339";
const TAG = "SC_DATA_V3:";

let files = [], recycle = [], currentMsgId = null;

function login() {
    if(document.getElementById("pwInput").value === "Suman400@") {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("appPage").classList.remove("hidden");
        syncData();
    } else { alert("ভুল পাসওয়ার্ড!"); }
}

async function syncData() {
    try {
        // অন্য ফোন থেকে ডাটা দেখার জন্য আমরা লেটেস্ট আপডেট চেক করছি
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-100&limit=100`);
        const d = await r.json();
        if(d.ok && d.result.length > 0) {
            const updates = d.result.reverse();
            for(let u of updates) {
                const msg = u.channel_post || u.message;
                if(msg && msg.text && msg.text.startsWith(TAG)) {
                    const data = JSON.parse(msg.text.replace(TAG, ""));
                    files = data.files || [];
                    recycle = data.recycle || [];
                    currentMsgId = msg.message_id;
                    break;
                }
            }
        }
        render();
    } catch(e) { console.error("সিঙ্ক সমস্যা"); }
}

async function saveData() {
    const text = TAG + JSON.stringify({ files, recycle });
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
    const res = await r.json();
    if(res.ok) {
        if(currentMsgId) fetch(`https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage?chat_id=${CHAT_ID}&message_id=${currentMsgId}`);
        currentMsgId = res.result.message_id;
    }
}

async function uploadFiles(input) {
    const upFiles = Array.from(input.files);
    document.getElementById("pw").style.display = "block";
    for(let i=0; i<upFiles.length; i++) {
        const f = upFiles[i];
        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("document", f);
        const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: 'POST', body: fd });
        const d = await r.json();
        if(d.ok) {
            files.unshift({ id: Date.now(), name: f.name, size: f.size, fileId: d.result.document.file_id, date: new Date().toLocaleDateString('bn-IN') });
        }
        document.getElementById("pf").style.width = ((i+1)/upFiles.length*100) + "%";
    }
    await saveData();
    document.getElementById("pw").style.display = "none";
    render();
}

function render() {
    const list = document.getElementById("mainList");
    document.getElementById("stats").innerText = files.length;
    document.getElementById("usedSize").innerText = (files.reduce((a,b)=>a+b.size,0)/1048576).toFixed(2) + " MB";
    list.innerHTML = files.map(f => `
        <div class="fileCard">
            <div class="fileInfo">
                <div class="fileName">${f.name}</div>
                <div style="font-size:10px; color:#aaa">${f.date}</div>
            </div>
            <button onclick="delFile(${f.id})" style="background:none; border:none; color:#ff6b6b; cursor:pointer">🗑️</button>
        </div>
    `).join("");
}

async function delFile(id) {
    const idx = files.findIndex(f => f.id === id);
    recycle.unshift(files.splice(idx, 1)[0]);
    await saveData();
    render();
}

function switchTab(t) {
    document.getElementById("filesView").classList.toggle("hidden", t !== 'files');
    document.getElementById("recycleView").classList.toggle("hidden", t !== 'recycle');
    document.getElementById("tabFiles").classList.toggle("active", t === 'files');
    document.getElementById("tabRecycle").classList.toggle("active", t === 'recycle');
}
</script>
</body>
</html>
