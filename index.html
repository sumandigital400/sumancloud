<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suman's Cloud ☁️</title>
<meta name="theme-color" content="#1a1a2e"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff}
.hidden{display:none!important}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.loginBox{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:24px;padding:40px 36px;width:320px;text-align:center}
.ico{font-size:52px;margin-bottom:8px}
.loginBox h2{font-size:21px;font-weight:700;margin-bottom:4px}
.loginBox p{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:24px}
.ipt{width:100%;padding:11px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);color:#fff;font-size:15px;outline:none;margin-bottom:8px}
.ipt.err{border-color:#ff6b6b}
.errMsg{color:#ff6b6b;font-size:13px;margin-bottom:8px;display:none}
.btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.linkBtn{background:none;border:none;color:#a5b4fc;font-size:13px;cursor:pointer;margin-top:12px;text-decoration:underline}
#appPage{max-width:780px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.header h1{font-size:20px;font-weight:800}
.header p{color:rgba(255,255,255,0.4);font-size:11px;margin-top:2px}
.hdrBtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:12px}
.diskBox{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.diskTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.diskBar{height:10px;background:rgba(255,255,255,0.08);border-radius:20px;overflow:hidden}
.diskFill{height:100%;width:0%;border-radius:20px;transition:width .8s}
.diskBot{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:rgba(255,255,255,0.4)}
.uploadArea{border:2px dashed rgba(255,255,255,0.2);border-radius:18px;padding:20px 16px;text-align:center;background:rgba(255,255,255,0.04);margin-bottom:14px;transition:all .2s}
.uploadArea.drag{border-color:#667eea;background:rgba(102,126,234,0.1)}
.upBtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.upBtn{padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;font-size:13px;font-weight:600}
.progressBar{height:5px;background:rgba(255,255,255,0.1);border-radius:10px;margin-top:12px;overflow:hidden;display:none}
.progressFill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);width:0%;transition:width .3s;border-radius:10px}
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tbBtn{padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);cursor:pointer;font-size:12px;transition:all .2s}
.tbBtn.active{background:rgba(102,126,234,0.3);border-color:#667eea;color:#fff}
.searchBox{width:100%;padding:10px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.07);color:#fff;font-size:14px;outline:none;margin-bottom:10px}
.navRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backBtn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1}
.crumb{color:#a5b4fc;cursor:pointer;font-size:13px;font-weight:600}
.crumbSep{color:rgba(255,255,255,0.3);font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:rgba(102,126,234,0.3);border-color:#667eea;color:#fff}
.folderCard{background:rgba(255,200,50,0.08);border:1px solid rgba(255,200,50,0.2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.folderCard:hover{background:rgba(255,200,50,0.15)}
.folderIco{font-size:28px;flex-shrink:0}
.folderInfo{flex:1;min-width:0}
.folderName{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folderMeta{color:rgba(255,255,255,0.4);font-size:11px;margin-top:2px}
.fileCard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fileCard.selected{border-color:#667eea;background:rgba(102,126,234,0.12)}
.fileIco{font-size:26px;flex-shrink:0}
.fileInfo{flex:1;min-width:0}
.fileName{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileMeta{color:rgba(255,255,255,0.35);font-size:11px;margin-top:2px}
.fileBtns{display:flex;gap:5px;flex-shrink:0}
.iconBtn{padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12px;border:1px solid;text-decoration:none;display:inline-block}
.previewIco{background:rgba(102,126,234,0.25);border-color:rgba(102,126,234,0.4);color:#a5b4fc}
.dlIco{background:rgba(81,207,102,0.15);border-color:rgba(81,207,102,0.3);color:#51cf66}
.renameIco{background:rgba(255,212,59,0.15);border-color:rgba(255,212,59,0.3);color:#ffd43b}
.delIco{background:rgba(255,107,107,0.15);border-color:rgba(255,107,107,0.3);color:#ff6b6b}
.restoreIco{background:rgba(81,207,102,0.15);border-color:rgba(81,207,102,0.3);color:#51cf66}
.chk{width:16px;height:16px;cursor:pointer;flex-shrink:0}
.recycleBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.emptyBin{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.1);color:#ff6b6b;cursor:pointer;font-size:13px;font-weight:600}
.empty{text-align:center;color:rgba(255,255,255,0.25);padding:40px 0}
.empty div{font-size:44px;margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modalBox{background:#16213e;border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:26px;width:320px;max-width:95vw}
.modalBox h3{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
.modalBtns{display:flex;gap:8px;margin-top:12px}
.modalBtns button{flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.cancelBtn{background:rgba(255,255,255,0.1);color:#fff}
.confirmBtn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.previewOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.previewBox{background:#1a1a2e;border-radius:20px;padding:20px;max-width:95vw;max-height:95vh;overflow:auto;position:relative;min-width:320px}
.previewClose{position:absolute;top:12px;right:16px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:20px;cursor:pointer;border-radius:8px;padding:4px 10px;z-index:10}
.previewBox img,.previewBox video,.previewBox audio{max-width:100%;max-height:70vh;border-radius:10px}
.pdf-actions{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pdf-btn{padding:9px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.pdf-open{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.pdf-dl{background:rgba(81,207,102,0.2);border:1px solid rgba(81,207,102,0.4);color:#51cf66}
.pdf-thumb{width:100%;max-width:500px;height:400px;border:none;border-radius:12px;background:#fff}
.toast{position:fixed;top:20px;right:20px;padding:11px 18px;border-radius:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:fadeIn .3s}
.toast.ok{background:#51cf66;color:#fff}
.toast.err{background:#ff6b6b;color:#fff}
.toast.info{background:#339af0;color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="loginPage">
  <div class="loginBox">
    <div class="ico">☁️</div>
    <h2>Suman's Cloud</h2>
    <p>Password দিয়ে প্রবেশ করুন</p>
    <input type="password" class="ipt" id="pwInput" placeholder="Password লিখুন..."/>
    <div class="errMsg" id="errMsg">❌ Wrong password!</div>
    <button class="btn" id="loginBtn">প্রবেশ করুন →</button>
    <br/>
    <button class="linkBtn" id="changePwBtn">🔑 Password পরিবর্তন করুন</button>
  </div>
</div>

<div id="appPage" class="hidden">
  <div class="header">
    <div><h1>☁️ Suman's Cloud</h1><p id="stats">লোড হচ্ছে...</p></div>
    <button class="hdrBtn" id="logoutBtn">🔒 Logout</button>
  </div>

  <div class="diskBox">
    <div class="diskTop">
      <div style="display:flex;align-items:center;gap:6px"><span>💾</span><b style="font-size:14px">Storage</b></div>
      <span id="diskPct" style="font-size:12px;color:rgba(255,255,255,0.5)">0%</span>
    </div>
    <div class="diskBar"><div class="diskFill" id="diskFill"></div></div>
    <div class="diskBot"><span id="diskUsed">0 MB</span><span>মোট 25 GB</span></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="files">📁 Files</button>
    <button class="tab" data-tab="recycle">🗑️ Recycle Bin<span id="binCount"></span></button>
  </div>

  <div id="filesTab">
    <div class="uploadArea" id="uploadArea">
      <input type="file" id="fileInput" multiple hidden/>
      <input type="file" id="folderInput" webkitdirectory multiple hidden/>
      <div style="font-size:30px;margin-bottom:6px">📤</div>
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">Drag করো অথবা button click করো</div>
      <div class="upBtns">
        <button class="upBtn" id="fileBtnTrigger">📄 Files</button>
        <button class="upBtn" id="folderBtnTrigger">📁 Folder</button>
        <button class="upBtn" id="newFolderBtn">➕ New Folder</button>
      </div>
      <div class="progressBar" id="progressBar"><div class="progressFill" id="progressFill"></div></div>
    </div>

    <input class="searchBox" id="searchBox" placeholder="🔍 ফাইল বা folder খুঁজুন..."/>

    <div class="toolbar">
      <button class="tbBtn active" data-sort="new">🕒 নতুন আগে</button>
      <button class="tbBtn" data-sort="old">🕰️ পুরনো আগে</button>
      <button class="tbBtn active" data-filter="all">সব</button>
      <button class="tbBtn" data-filter="photo">🖼️ Photo</button>
      <button class="tbBtn" data-filter="pdf">📕 PDF</button>
      <button class="tbBtn" data-filter="text">📄 Text</button>
      <button class="tbBtn" data-filter="others">📎 Others</button>
    </div>

    <div class="navRow">
      <button class="backBtn hidden" id="backBtn">← Back</button>
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <div id="mainList"></div>
  </div>

  <div id="recycleTab" class="hidden">
    <div class="recycleBar">
      <span style="font-size:14px;font-weight:600">🗑️ Recycle Bin</span>
      <button class="emptyBin" id="emptyBinBtn">🗑️ সব মুছুন</button>
    </div>
    <div id="recycleList"></div>
  </div>
</div>

<!-- PASSWORD CHANGE MODAL -->
<div class="overlay hidden" id="changePwModal">
  <div class="modalBox">
    <h3>🔑 Password পরিবর্তন</h3>
    <p style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:12px;text-align:center">Master Key টাইপ করুন</p>
    <input type="password" class="ipt" id="masterKeyInput" placeholder="Master Key..."/>
    <div class="errMsg" id="masterKeyErr">❌ Master Key ভুল!</div>
    <input type="password" class="ipt hidden" id="newPwInput" placeholder="নতুন Password..."/>
    <input type="password" class="ipt hidden" id="confirmPwInput" placeholder="আবার লিখুন..."/>
    <div class="errMsg" id="pwMatchErr">❌ Password মিলছে না!</div>
    <div class="modalBtns">
      <button class="cancelBtn" id="cancelPwBtn">বাতিল</button>
      <button class="confirmBtn" id="verifyMasterBtn">যাচাই করুন</button>
    </div>
  </div>
</div>

<!-- NEW FOLDER MODAL -->
<div class="overlay hidden" id="newFolderModal">
  <div class="modalBox">
    <h3>➕ নতুন Folder তৈরি</h3>
    <input type="text" class="ipt" id="newFolderInput" placeholder="Folder এর নাম..."/>
    <div class="modalBtns">
      <button class="cancelBtn" id="cancelFolderBtn">বাতিল</button>
      <button class="confirmBtn" id="createFolderBtn">তৈরি করুন</button>
    </div>
  </div>
</div>

<!-- RENAME MODAL -->
<div class="overlay hidden" id="renameModal">
  <div class="modalBox">
    <h3>✏️ Rename</h3>
    <input type="text" class="ipt" id="renameInput" placeholder="নতুন নাম..."/>
    <div class="modalBtns">
      <button class="cancelBtn" id="cancelRenameBtn">বাতিল</button>
      <button class="confirmBtn" id="confirmRenameBtn">Save</button>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div class="previewOverlay hidden" id="previewOverlay">
  <div class="previewBox">
    <button class="previewClose" id="previewClose">✕</button>
    <div id="previewContent"></div>
  </div>
</div>

<script>
const MASTER_KEY_VAL="1921131514";
const SESSION_KEY="suman_session";
const SESSION_TIMEOUT=30*60*1000;
const CLOUD_NAME="dop2hrguf";
const UPLOAD_PRESET="te0dmvlx";
const TG_TOKEN="8703347824:AAHT2yKhqV5fp2j70H3bl9gQORqd1p1wOJ4";
const TG_CHAT="-1003981955339";
const TG_API=`https://api.telegram.org/bot${TG_TOKEN}`;
const JBIN_KEY="$2a$10$FRmbTIpy1dOdAXqTfp7aiOMOetWkTSSE.V0jcROG6rQk5/kD7eeme";
const BIN_ID="69ec3f15856a6821896df568";
const API="https://api.jsonbin.io/v3";

let PASS=localStorage.getItem("suman_pw")||"Suman400@";
let inactivityTimer=null;
let allFiles=[];
let recycleBin=[];
let currentPath=[];
let currentSort="new";
let currentFilter="all";
let activeTab="files";
let renameTarget=null;

window.addEventListener("load",()=>{
  const t=sessionStorage.getItem(SESSION_KEY);
  if(t&&Date.now()-parseInt(t)<SESSION_TIMEOUT) showApp();
});

window.addEventListener("popstate",()=>{
  if(activeTab==="files"&&currentPath.length>0){
    currentPath.pop(); renderView();
    if(currentPath.length>0) history.pushState({},"","");
  }
});

function saveSession(){sessionStorage.setItem(SESSION_KEY,Date.now());}
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(()=>{showToast("৩০ মিনিট inactive — logout","err");setTimeout(logout,1500);},SESSION_TIMEOUT);
  saveSession();
}
function startListeners(){["click","keydown","mousemove","touchstart","scroll"].forEach(e=>document.addEventListener(e,resetInactivityTimer,{passive:true}));}
function showApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");
  loadFiles();resetInactivityTimer();startListeners();
}
function logout(){
  sessionStorage.removeItem(SESSION_KEY);clearTimeout(inactivityTimer);
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("pwInput").value="";
  document.getElementById("pwInput").classList.remove("err");
  document.getElementById("errMsg").style.display="none";
}

document.getElementById("loginBtn").addEventListener("click",()=>{
  const v=document.getElementById("pwInput").value;
  if(v===PASS){saveSession();showApp();}
  else{document.getElementById("pwInput").classList.add("err");document.getElementById("errMsg").style.display="block";document.getElementById("pwInput").value="";}
});
document.getElementById("pwInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});
document.getElementById("logoutBtn").addEventListener("click",logout);

let masterVerified=false;
document.getElementById("changePwBtn").addEventListener("click",()=>{
  masterVerified=false;
  ["masterKeyInput","newPwInput","confirmPwInput"].forEach(id=>document.getElementById(id).value="");
  ["masterKeyErr","pwMatchErr"].forEach(id=>document.getElementById(id).style.display="none");
  document.getElementById("newPwInput").classList.add("hidden");
  document.getElementById("confirmPwInput").classList.add("hidden");
  document.getElementById("verifyMasterBtn").textContent="যাচাই করুন";
  document.getElementById("changePwModal").classList.remove("hidden");
});
document.getElementById("cancelPwBtn").addEventListener("click",()=>document.getElementById("changePwModal").classList.add("hidden"));
document.getElementById("verifyMasterBtn").addEventListener("click",()=>{
  if(!masterVerified){
    if(document.getElementById("masterKeyInput").value===MASTER_KEY_VAL){
      masterVerified=true;
      document.getElementById("masterKeyErr").style.display="none";
      document.getElementById("newPwInput").classList.remove("hidden");
      document.getElementById("confirmPwInput").classList.remove("hidden");
      document.getElementById("verifyMasterBtn").textContent="Save করুন";
      showToast("Master Key সঠিক!","info");
    }else{document.getElementById("masterKeyErr").style.display="block";}
  }else{
    const np=document.getElementById("newPwInput").value;
    const cp=document.getElementById("confirmPwInput").value;
    if(!np){showToast("Password খালি রাখা যাবে না","err");return;}
    if(np!==cp){document.getElementById("pwMatchErr").style.display="block";return;}
    PASS=np;localStorage.setItem("suman_pw",PASS);
    document.getElementById("changePwModal").classList.add("hidden");
    showToast("Password পরিবর্তন হয়েছে ✅");
  }
});

document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    activeTab=t.dataset.tab;
    document.getElementById("filesTab").classList.toggle("hidden",activeTab!=="files");
    document.getElementById("recycleTab").classList.toggle("hidden",activeTab!=="recycle");
    if(activeTab==="recycle") renderRecycle();
  });
});

document.querySelectorAll("[data-sort]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("[data-sort]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");currentSort=b.dataset.sort;renderView();
  });
});
document.querySelectorAll("[data-filter]").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");currentFilter=b.dataset.filter;renderView();
  });
});

document.getElementById("newFolderBtn").addEventListener("click",e=>{
  e.stopPropagation();
  document.getElementById("newFolderInput").value="";
  document.getElementById("newFolderModal").classList.remove("hidden");
  setTimeout(()=>document.getElementById("newFolderInput").focus(),100);
});
document.getElementById("cancelFolderBtn").addEventListener("click",()=>document.getElementById("newFolderModal").classList.add("hidden"));
document.getElementById("createFolderBtn").addEventListener("click",createFolder);
document.getElementById("newFolderInput").addEventListener("keydown",e=>{if(e.key==="Enter")createFolder();});

async function createFolder(){
  const name=document.getElementById("newFolderInput").value.trim();
  if(!name){showToast("Folder এর নাম দিন","err");return;}
  const cur=currentPath.join("/");
  const folderPath=cur?cur+"/"+name:name;
  allFiles.push({id:"folder_placeholder_"+Date.now(),name:".folder",path:folderPath,size:0,url:"",date:new Date().toLocaleDateString("bn-IN"),ts:Date.now(),isPlaceholder:true});
  await saveFiles();
  document.getElementById("newFolderModal").classList.add("hidden");
  renderView();showToast("Folder তৈরি হয়েছে ✅");
}

document.getElementById("cancelRenameBtn").addEventListener("click",()=>document.getElementById("renameModal").classList.add("hidden"));
document.getElementById("confirmRenameBtn").addEventListener("click",doRename);
document.getElementById("renameInput").addEventListener("keydown",e=>{if(e.key==="Enter")doRename();});

function openRename(type,id,oldName,oldPath){
  renameTarget={type,id,oldName,oldPath};
  document.getElementById("renameInput").value=oldName;
  document.getElementById("renameModal").classList.remove("hidden");
  setTimeout(()=>document.getElementById("renameInput").focus(),100);
}

async function doRename(){
  const newName=document.getElementById("renameInput").value.trim();
  if(!newName){showToast("নাম দিন","err");return;}
  if(!renameTarget)return;
  if(renameTarget.type==="file"){
    const f=allFiles.find(x=>x.id===renameTarget.id);
    if(f)f.name=newName;
  }else{
    const oldFP=renameTarget.oldPath;
    const parts=oldFP.split("/");parts[parts.length-1]=newName;
    const newFP=parts.join("/");
    allFiles.forEach(f=>{
      if((f.path||"")===oldFP)f.path=newFP;
      else if((f.path||"").startsWith(oldFP+"/"))f.path=newFP+f.path.slice(oldFP.length);
    });
  }
  await saveFiles();
  document.getElementById("renameModal").classList.add("hidden");
  renderView();showToast("Rename হয়েছে ✅");
}

async function loadFiles(){
  const cached=localStorage.getItem("suman_cache");
  if(cached){
    const c=JSON.parse(cached);
    allFiles=c.files||[];recycleBin=c.recycle||[];
    updateDisk();renderView();updateBinCount();
    document.getElementById("stats").textContent=allFiles.filter(f=>!f.isPlaceholder).length+" ফাইল";
  }
  try{
    const r=await fetch(`${API}/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":JBIN_KEY}});
    const d=await r.json();
    const rec=d.record;
    allFiles=rec.files||[];recycleBin=rec.recycle||[];
    saveCache();updateDisk();renderView();updateBinCount();
    document.getElementById("stats").textContent=allFiles.filter(f=>!f.isPlaceholder).length+" ফাইল";
  }catch(e){showToast("Sync সমস্যা","err");}
}

async function saveFiles(){
  saveCache();
  await fetch(`${API}/b/${BIN_ID}`,{
    method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":JBIN_KEY},
    body:JSON.stringify({files:allFiles,recycle:recycleBin})
  });
}
function saveCache(){localStorage.setItem("suman_cache",JSON.stringify({files:allFiles,recycle:recycleBin}));}
function updateBinCount(){const el=document.getElementById("binCount");el.textContent=recycleBin.length?` (${recycleBin.length})`:""}

document.getElementById("fileBtnTrigger").addEventListener("click",e=>{e.stopPropagation();document.getElementById("fileInput").click();});
document.getElementById("folderBtnTrigger").addEventListener("click",e=>{e.stopPropagation();document.getElementById("folderInput").click();});
document.getElementById("fileInput").addEventListener("change",e=>{
  uploadCollected(Array.from(e.target.files).map(f=>({file:f,path:currentPath.join("/")})));
  e.target.value="";
});
document.getElementById("folderInput").addEventListener("change",e=>{
  const cur=currentPath.join("/");
  const col=Array.from(e.target.files).map(f=>{
    const parts=f.webkitRelativePath.split("/");parts.pop();
    const rel=parts.join("/");
    return{file:f,path:cur?cur+"/"+rel:rel};
  });
  uploadCollected(col);e.target.value="";
});
document.getElementById("uploadArea").addEventListener("dragover",e=>{e.preventDefault();e.currentTarget.classList.add("drag");});
document.getElementById("uploadArea").addEventListener("dragleave",e=>e.currentTarget.classList.remove("drag"));
document.getElementById("uploadArea").addEventListener("drop",drop);
document.getElementById("searchBox").addEventListener("input",renderView);

async function drop(e){
  e.preventDefault();e.currentTarget.classList.remove("drag");
  const items=e.dataTransfer.items;
  const cur=currentPath.join("/");
  if(items){
    const col=[];
    for(let item of items){const en=item.webkitGetAsEntry();if(en)await traverseEntry(en,cur,col);}
    if(col.length)await uploadCollected(col);
  }else{
    await uploadCollected(Array.from(e.dataTransfer.files).map(f=>({file:f,path:cur})));
  }
}

async function traverseEntry(entry,base,col){
  if(entry.isFile)await new Promise(r=>entry.file(f=>{col.push({file:f,path:base});r();}));
  else if(entry.isDirectory){
    const fp=base?base+"/"+entry.name:entry.name;
    const rd=entry.createReader();
    await new Promise(r=>rd.readEntries(async entries=>{for(let e of entries)await traverseEntry(e,fp,col);r();}));
  }
}

async function uploadCollected(col){
  if(!col.length)return;
  const bar=document.getElementById("progressBar"),fill=document.getElementById("progressFill");
  bar.style.display="block";fill.style.width="0%";
  showToast("Upload শুরু হয়েছে...","info");
  for(let i=0;i<col.length;i++){
    const{file,path}=col[i];
    const isPdf=/\.pdf$/i.test(file.name);
    try{
      let url="";
      if(isPdf){
        // PDF → Telegram
        const fd=new FormData();
        fd.append("chat_id",TG_CHAT);
        fd.append("document",file,file.name);
        const res=await fetch(`${TG_API}/sendDocument`,{method:"POST",body:fd});
        const data=await res.json();
        if(data.ok){
          const fileId=data.result.document.file_id;
          // Telegram file path আনো
          const fp=await fetch(`${TG_API}/getFile?file_id=${fileId}`);
          const fpData=await fp.json();
          const filePath=fpData.result.file_path;
          url=`${TG_API}/file/${filePath}`;
          // কিন্তু এই URL browser এ direct open হয় না
          // তাই file_id store করি, download এর সময় ব্যবহার করব
          url=`tg://${fileId}`;
        }else{
          showToast("Failed: "+file.name,"err");
        }
      }else{
        // বাকি সব → Cloudinary
        const fd=new FormData();
        fd.append("file",file);fd.append("upload_preset",UPLOAD_PRESET);fd.append("resource_type","auto");
        const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:"POST",body:fd});
        const data=await res.json();
        url=data.secure_url||"";
      }
      if(url)allFiles.unshift({id:"file_"+Date.now()+"_"+i,name:file.name,path,size:file.size,url,date:new Date().toLocaleDateString("bn-IN"),ts:Date.now()});
    }catch(e){showToast("Failed: "+file.name,"err");}
    fill.style.width=((i+1)/col.length*100)+"%";
  }
  await saveFiles();
  setTimeout(()=>{bar.style.display="none";},800);
  document.getElementById("stats").textContent=allFiles.filter(f=>!f.isPlaceholder).length+" ফাইল";
  updateDisk();renderView();showToast(col.length+"টি ফাইল upload হয়েছে ✅");
}

function updateDisk(){
  const total=25*1024*1024*1024,used=allFiles.reduce((a,f)=>a+f.size,0);
  const pct=Math.min((used/total)*100,100);
  const fill=document.getElementById("diskFill");
  fill.style.width=pct+"%";
  fill.style.background=pct>85?"linear-gradient(90deg,#ff6b6b,#f03e3e)":pct>60?"linear-gradient(90deg,#ffd43b,#fab005)":"linear-gradient(90deg,#51cf66,#94d82d)";
  document.getElementById("diskPct").textContent=pct.toFixed(2)+"%";
  document.getElementById("diskUsed").textContent=fmtSize(used)+" ব্যবহার";
}

function renderView(){
  const q=document.getElementById("searchBox").value.toLowerCase().trim();
  const cur=currentPath.join("/");
  const backBtn=document.getElementById("backBtn");
  if(currentPath.length>0)backBtn.classList.remove("hidden");
  else backBtn.classList.add("hidden");

  const bc=document.getElementById("breadcrumb");
  bc.innerHTML=`<span class="crumb" data-path="">🏠 Home</span>`;
  currentPath.forEach((p,i)=>{bc.innerHTML+=`<span class="crumbSep">›</span><span class="crumb" data-path="${currentPath.slice(0,i+1).join("/")}">${p}</span>`;});
  bc.querySelectorAll(".crumb").forEach(el=>el.addEventListener("click",()=>{
    const p=el.dataset.path;currentPath=p?p.split("/"):[];
    if(currentPath.length>0)history.pushState({},"","");
    renderView();
  }));

  const list=document.getElementById("mainList");
  const filterFile=f=>{
    if(currentFilter==="photo")return/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(f.name);
    if(currentFilter==="pdf")return/\.pdf$/i.test(f.name);
    if(currentFilter==="text")return/\.(txt|md|doc|docx)$/i.test(f.name);
    if(currentFilter==="others")return!/\.(jpg|jpeg|png|gif|webp|svg|pdf|txt|md|doc|docx)$/i.test(f.name);
    return true;
  };

  if(q){
    let matched=allFiles.filter(f=>!f.isPlaceholder&&(f.name.toLowerCase().includes(q)||(f.path||"").toLowerCase().includes(q))&&filterFile(f));
    matched=sortFiles(matched);
    if(!matched.length){list.innerHTML=`<div class="empty"><div>🔍</div><p>কোনো ফাইল পাওয়া যায়নি</p></div>`;return;}
    list.innerHTML=matched.map(f=>fileCardHTML(f,true)).join("");
    attachEvents();return;
  }

  const subFolders=new Set();
  allFiles.forEach(f=>{
    const fp=f.path||"";
    if(cur===""){if(fp)subFolders.add(fp.split("/")[0]);}
    else if(fp.startsWith(cur+"/")){const rest=fp.slice(cur.length+1).split("/");if(rest[0])subFolders.add(rest[0]);}
  });

  let directFiles=allFiles.filter(f=>!f.isPlaceholder&&(f.path||"")===cur&&filterFile(f));
  directFiles=sortFiles(directFiles);

  if(!subFolders.size&&!directFiles.length){list.innerHTML=`<div class="empty"><div>📭</div><p>এখানে কোনো ফাইল নেই</p></div>`;return;}

  let html="";
  subFolders.forEach(folder=>{
    const fp=cur?cur+"/"+folder:folder;
    const count=allFiles.filter(f=>!f.isPlaceholder&&((f.path||"")===fp||(f.path||"").startsWith(fp+"/"))).length;
    html+=`<div class="folderCard" data-folder="${folder}" data-fpath="${fp}">
      <div class="folderIco">📁</div>
      <div class="folderInfo"><div class="folderName">${folder}</div><div class="folderMeta">${count}টি ফাইল</div></div>
      <div style="display:flex;gap:5px">
        <button class="iconBtn renameIco folderRename" data-folder="${folder}" data-fpath="${fp}">✏️</button>
        <button class="iconBtn delIco folderDel" data-fpath="${fp}">🗑️</button>
      </div>
    </div>`;
  });
  html+=directFiles.map(f=>fileCardHTML(f,false)).join("");
  list.innerHTML=html;
  attachEvents();
}

function sortFiles(arr){return[...arr].sort((a,b)=>currentSort==="new"?(b.ts||0)-(a.ts||0):(a.ts||0)-(b.ts||0));}

function fileCardHTML(f,showPath){
  const isPDF=/\.pdf$/i.test(f.name);
  return`<div class="fileCard" data-id="${f.id}">
    <input type="checkbox" class="chk fileChk" data-id="${f.id}"/>
    <div class="fileIco">${getIcon(f.name)}</div>
    <div class="fileInfo">
      <div class="fileName">${f.name}</div>
      <div class="fileMeta">${fmtSize(f.size)} · ${f.date}${showPath&&f.path?' · 📁 '+f.path:''}</div>
    </div>
    <div class="fileBtns">
      <button class="iconBtn previewIco previewBtn" data-id="${f.id}">👁️</button>
      <button class="iconBtn dlIco dlBtn" data-id="${f.id}" data-url="${f.url}" data-name="${f.name}">⬇️</button>
      <button class="iconBtn renameIco fileRename" data-id="${f.id}" data-name="${f.name}">✏️</button>
      <button class="iconBtn delIco moveToRecycle" data-id="${f.id}">🗑️</button>
    </div>
  </div>`;
}

function attachEvents(){
  document.querySelectorAll(".folderCard").forEach(el=>{
    el.addEventListener("click",e=>{
      if(e.target.closest(".folderRename")||e.target.closest(".folderDel"))return;
      currentPath=[...currentPath,el.dataset.folder];
      history.pushState({},"","");renderView();
    });
  });
  document.querySelectorAll(".folderRename").forEach(el=>{
    el.addEventListener("click",e=>{e.stopPropagation();openRename("folder",null,el.dataset.folder,el.dataset.fpath);});
  });
  document.querySelectorAll(".folderDel").forEach(el=>{
    el.addEventListener("click",e=>{e.stopPropagation();delFolder(el.dataset.fpath);});
  });
  document.querySelectorAll(".previewBtn").forEach(el=>el.addEventListener("click",()=>preview(el.dataset.id)));

  // ✅ FIX: blob download for all files (PDF + others)
  document.querySelectorAll(".dlBtn").forEach(el=>{
    el.addEventListener("click",()=>downloadFile(el.dataset.url, el.dataset.name));
  });

  document.querySelectorAll(".fileRename").forEach(el=>{
    el.addEventListener("click",()=>openRename("file",el.dataset.id,el.dataset.name,""));
  });
  document.querySelectorAll(".moveToRecycle").forEach(el=>{
    el.addEventListener("click",()=>moveToRecycle(el.dataset.id));
  });
  document.querySelectorAll(".fileChk").forEach(el=>{
    el.addEventListener("change",e=>{e.target.closest(".fileCard").classList.toggle("selected",e.target.checked);});
  });
}

// Telegram file URL বানানো
async function getTgUrl(fileId){
  const res=await fetch(`${TG_API}/getFile?file_id=${fileId}`);
  const data=await res.json();
  if(data.ok) return `https://api.telegram.org/file/bot${TG_TOKEN}/${data.result.file_path}`;
  return null;
}

function isTg(url){return url&&url.startsWith("tg://");}
function getTgFileId(url){return url.replace("tg://","");}

function fixCloudinaryUrl(url){
  return url.replace('/image/upload/','/raw/upload/').replace('/video/upload/','/raw/upload/');
}

async function downloadFile(url, name){
  showToast("Download শুরু হচ্ছে...","info");
  let dlUrl=url;
  if(isTg(url)){
    dlUrl=await getTgUrl(getTgFileId(url));
    if(!dlUrl){showToast("Download failed","err");return;}
  }
  try{
    const res=await fetch(dlUrl);
    if(!res.ok)throw new Error();
    const blob=await res.blob();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
    showToast("Download সম্পন্ন ✅");
  }catch(e){
    window.open(dlUrl,"_blank");
    showToast("নতুন tab এ খুলছে","info");
  }
}

document.getElementById("backBtn").addEventListener("click",()=>{
  if(currentPath.length>0){currentPath.pop();renderView();}
});

async function moveToRecycle(id){
  const f=allFiles.find(x=>x.id===id);if(!f)return;
  f.deletedAt=new Date().toLocaleDateString("bn-IN");
  recycleBin.unshift(f);
  allFiles=allFiles.filter(x=>x.id!==id);
  saveCache();
  document.getElementById("stats").textContent=allFiles.filter(f=>!f.isPlaceholder).length+" ফাইল";
  updateDisk();renderView();updateBinCount();
  showToast("Recycle Bin এ গেছে 🗑️","info");
  await saveFiles();
}

async function delFolder(path){
  if(!confirm("এই folder Recycle Bin এ যাবে। নিশ্চিত?"))return;
  const toMove=allFiles.filter(f=>(f.path||"")===path||(f.path||"").startsWith(path+"/"));
  toMove.forEach(f=>{f.deletedAt=new Date().toLocaleDateString("bn-IN");recycleBin.unshift(f);});
  allFiles=allFiles.filter(f=>!((f.path||"")===path||(f.path||"").startsWith(path+"/")));
  saveCache();updateDisk();renderView();updateBinCount();
  showToast("Folder Recycle Bin এ গেছে","info");
  await saveFiles();
}

function renderRecycle(){
  const list=document.getElementById("recycleList");
  if(!recycleBin.length){list.innerHTML=`<div class="empty"><div>🗑️</div><p>Recycle Bin খালি</p></div>`;return;}
  list.innerHTML=recycleBin.map(f=>`
    <div class="fileCard">
      <input type="checkbox" class="chk recycleChk" data-id="${f.id}"/>
      <div class="fileIco">${getIcon(f.name)}</div>
      <div class="fileInfo"><div class="fileName">${f.name}</div><div class="fileMeta">${fmtSize(f.size)} · মুছেছে: ${f.deletedAt||""}</div></div>
      <div class="fileBtns">
        <button class="iconBtn restoreIco restoreBtn" data-id="${f.id}">♻️</button>
        <button class="iconBtn delIco permDel" data-id="${f.id}">❌</button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".restoreBtn").forEach(el=>el.addEventListener("click",()=>restoreFile(el.dataset.id)));
  document.querySelectorAll(".permDel").forEach(el=>el.addEventListener("click",()=>permDelete(el.dataset.id)));
}

async function restoreFile(id){
  const f=recycleBin.find(x=>x.id===id);if(!f)return;
  delete f.deletedAt;allFiles.unshift(f);recycleBin=recycleBin.filter(x=>x.id!==id);
  saveCache();updateDisk();renderRecycle();updateBinCount();
  document.getElementById("stats").textContent=allFiles.filter(f=>!f.isPlaceholder).length+" ফাইল";
  showToast("ফাইল পুনরুদ্ধার হয়েছে ♻️");
  await saveFiles();
}

async function permDelete(id){
  recycleBin=recycleBin.filter(x=>x.id!==id);
  saveCache();renderRecycle();updateBinCount();
  showToast("চিরতরে মুছে গেছে ❌","err");
  await saveFiles();
}

document.getElementById("emptyBinBtn").addEventListener("click",async()=>{
  if(!recycleBin.length){showToast("Bin ইতিমধ্যে খালি","info");return;}
  if(!confirm("সব ফাইল চিরতরে মুছে যাবে। নিশ্চিত?"))return;
  recycleBin=[];saveCache();renderRecycle();updateBinCount();
  showToast("Recycle Bin খালি হয়েছে 🗑️","err");
  await saveFiles();
});

// ✅ FIX: PDF preview — Google Docs viewer + direct open button
function preview(id){
  const f=allFiles.find(x=>x.id===id);if(!f)return;
  const ext=f.name.split(".").pop().toLowerCase();
  let html="";

  if(["jpg","jpeg","png","gif","webp","svg"].includes(ext)){
    html=`<img src="${f.url}" style="max-width:80vw;max-height:80vh;border-radius:10px"/>`;
  }else if(["mp4","webm","mov"].includes(ext)){
    html=`<video src="${f.url}" controls style="max-width:80vw;max-height:75vh;border-radius:10px"></video>`;
  }else if(["mp3","wav","ogg","aac"].includes(ext)){
    html=`<p style="margin-bottom:12px;font-weight:600;font-size:15px">🎵 ${f.name}</p><audio src="${f.url}" controls style="width:280px"></audio>`;
  }else if(ext==="pdf"){
    const fileId=isTg(f.url)?getTgFileId(f.url):null;
    html=`
      <div style="margin-bottom:12px;font-weight:700;font-size:15px">📕 ${f.name}</div>
      <div class="pdf-actions">
        <button class="pdf-btn pdf-dl" onclick="downloadFile('${f.url}','${f.name}')">⬇️ Download করুন</button>
        ${fileId?`<button class="pdf-btn pdf-open" onclick="openTgPdf('${fileId}')">🔗 খুলুন</button>`:`<button class="pdf-btn pdf-open" onclick="window.open('${f.url}','_blank')">🔗 খুলুন</button>`}
      </div>
      <div style="margin-top:16px;text-align:center;padding:40px;color:rgba(255,255,255,0.4)">
        <div style="font-size:60px">📕</div>
        <p style="margin-top:12px;font-size:14px">${f.name}</p>
        <p style="font-size:12px;margin-top:6px">Download করুন অথবা খুলুন</p>
      </div>`;
  }else{
    html=`<p style="padding:20px;text-align:center;line-height:1.8">
      <span style="font-size:40px">📎</span><br><br>
      <b>${f.name}</b><br><br>
      <button class="pdf-btn pdf-open" onclick="window.open('${f.url}','_blank')">🔗 নতুন Tab এ খুলুন</button>
      &nbsp;
      <button class="pdf-btn pdf-dl" onclick="downloadFile('${f.url}','${f.name}')">⬇️ Download</button>
    </p>`;
  }

  document.getElementById("previewContent").innerHTML=html;
  document.getElementById("previewOverlay").classList.remove("hidden");
}

async function openTgPdf(fileId){
  showToast("লোড হচ্ছে...","info");
  const url=await getTgUrl(fileId);
  if(url) window.open(url,"_blank");
  else showToast("খোলা যায়নি","err");
}

document.getElementById("previewClose").addEventListener("click",()=>{
  document.getElementById("previewOverlay").classList.add("hidden");
  document.getElementById("previewContent").innerHTML="";
});

function getIcon(n){
  const e=n.split(".").pop().toLowerCase();
  if(["jpg","jpeg","png","gif","webp","svg"].includes(e))return"🖼️";
  if(["mp4","mkv","avi","mov","webm"].includes(e))return"🎬";
  if(["mp3","wav","ogg","aac"].includes(e))return"🎵";
  if(e==="pdf")return"📕";
  if(["doc","docx"].includes(e))return"📝";
  if(["xls","xlsx","csv"].includes(e))return"📊";
  if(["zip","rar","7z","tar"].includes(e))return"🗜️";
  if(["txt","md"].includes(e))return"📄";
  return"📎";
}
function fmtSize(b){if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";if(b<1073741824)return(b/1048576).toFixed(1)+" MB";return(b/1073741824).toFixed(2)+" GB";}
function showToast(msg,type="ok"){const t=document.createElement("div");t.className=`toast ${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
</script>
